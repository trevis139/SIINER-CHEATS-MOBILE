name: Compilar SIINER CHEATS MOBILE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar arquivos
        run: |
          echo "Arquivos do projeto:"
          ls -la
          echo "Arquivos da pasta app:"
          ls -la app
          echo "Arquivos de código:"
          find app/src -type f

      - name: Construir APK
        run: gradle assembleDebug --stacktrace --info

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIINER-CHEATS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

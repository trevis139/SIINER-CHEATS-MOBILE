
name: Compilar SIINER CHEATS MOBILE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Instalar componentes Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar arquivos do projeto
        run: |
          echo "Arquivos da raiz:"
          ls -la
          echo "Arquivos da pasta app:"
          ls -la app
          echo "Arquivos de código:"
          find app/src -type f

      - name: Construir APK
        run: gradle assembleDebug --stacktrace --info

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIINER-CHEATS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
